# Fork-only: builds this fork's image and pushes it to GHCR. It never runs in
# lklynet/aurral, and is not meant to be part of an upstream pull request.
name: Fork image

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository != 'lklynet/aurral'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-ffmpeg

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]

      - name: Type check
        run: vp run typecheck

      - name: Unit tests
        run: vp run test

  publish-image:
    needs: test
    if: github.repository != 'lklynet/aurral'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image name and tags
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Image names must be lowercase; branch names may hold slashes.
          image="ghcr.io/${REPOSITORY,,}"
          branch="$(printf '%s' "${REF_NAME,,}" | tr -c 'a-z0-9._-' '-' | cut -c1-100)"
          tags="${image}:${branch},${image}:sha-${GITHUB_SHA:0:7}"
          if [ "${REF_NAME}" = "${DEFAULT_BRANCH}" ]; then tags="${tags},${image}:latest"; fi
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"
          echo "version=fork.${GITHUB_RUN_NUMBER}+${GITHUB_SHA:0:7}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log into ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.image.outputs.tags }}
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ steps.image.outputs.version }}
            GITHUB_REPO=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
